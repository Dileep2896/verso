# Render Blueprint. Point Render at this repo and it builds the Dockerfile and
# runs the web service. Render injects $PORT; the container binds to it.
services:
  - type: web
    name: verso
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # OCR only corroborates and is the heaviest step; off, the scan fits the
      # free tier with identical verdicts. Set to "1" on a larger instance.
      - key: VERSO_WEB_OCR
        value: "0"
